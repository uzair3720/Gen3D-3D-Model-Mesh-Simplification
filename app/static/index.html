<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen3D</title>
<style>
  :root {
    --bg:#1b1d21; --panel:#23262b; --raise:#2c3036; --line:#363a41; --ink:#d7dadf; --dim:#8b929c;
    --accent:#4c8dff; --err:#ff7b72;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font:12.5px/1.4 "Inter", "Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg);
         display:grid; grid-template-rows:38px minmax(0,1fr) 24px; grid-template-columns:minmax(0,1fr) 312px; }
  .num, td, input[type=number] { font-family:ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size:12px; }

  #top { grid-column:1 / 3; display:flex; align-items:center; gap:10px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top b { font-size:13px; letter-spacing:.02em; }
  #name { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }

  button, select, .btn { font:inherit; color:var(--ink); background:var(--raise); border:1px solid var(--line); border-radius:3px; padding:4px 10px; cursor:pointer; }
  button:hover:not(:disabled), .btn:hover { border-color:#565c66; }
  button:disabled { color:#5b616a; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:disabled { background:var(--raise); border-color:var(--line); color:#5b616a; }
  .seg { display:inline-flex; }
  .seg button { border-radius:0; margin-left:-1px; }
  .seg button:first-child { border-radius:3px 0 0 3px; margin-left:0; }
  .seg button:last-child { border-radius:0 3px 3px 0; }
  .seg button.on { background:#3d4350; border-color:#5a6272; color:#fff; position:relative; }

  #view { position:relative; min-width:0; min-height:0; overflow:hidden; background:#16181b; }
  #view canvas { display:block; }
  #view .tl, #view .tr, #view .bl { position:absolute; }
  #view .tl { top:8px; left:8px; }
  #view .tr { top:8px; right:8px; }
  #view .bl { left:10px; bottom:8px; color:var(--dim); display:flex; align-items:center; gap:8px; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); pointer-events:none; text-align:center; }
  #view.drag { outline:2px dashed var(--accent); outline-offset:-6px; }
  .ramp { width:140px; height:8px; background:linear-gradient(90deg,#3b6fd4,#9aa3ad,#e0483c); }
  .sw { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; }

  #side { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; min-height:0; }
  #side h2 { margin:0; padding:7px 10px; font-size:11.5px; font-weight:600; color:var(--dim); background:#1f2226; border-bottom:1px solid var(--line); border-top:1px solid var(--line); }
  #side h2:first-child { border-top:0; }
  .pad { padding:8px 10px; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:2.5px 0; text-align:right; white-space:nowrap; }
  td:first-child, th:first-child { text-align:left; font-family:inherit; font-size:12.5px; color:var(--dim); }
  th { font-weight:500; color:var(--dim); font-size:11.5px; padding-bottom:4px; }
  #edges td:first-child { font-family:ui-monospace, monospace; font-size:12px; color:var(--ink); }
  #edges td.muted { font-family:inherit; font-size:12.5px; color:var(--dim); }
  .field { display:grid; grid-template-columns:82px minmax(0,1fr) 62px; gap:8px; align-items:center; margin-bottom:8px; }
  .field label { color:var(--dim); }
  select { width:100%; grid-column:2 / 4; padding:4px 6px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=number] { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:3px 5px; }
  .muted { color:var(--dim); }

  #status { grid-column:1 / 3; display:flex; align-items:center; padding:0 10px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); font-size:12px; }
  #status.err { color:var(--err); }
</style>
</head>
<body>
<div id="top">
  <b>Gen3D</b>
  <label class="btn">Open...<input id="file" type="file" hidden accept=".png,.jpg,.jpeg,.webp,.glb,.gltf,.obj,.ply,.stl,.off"></label>
  <button id="sample">Load sample</button>
  <span id="name"></span>
</div>

<div id="view">
  <div id="empty">Open a 3D model (.glb .obj .ply .stl) or an image,<br>or drop a file here</div>
  <div class="tl seg" id="modes">
    <button data-view="solid" class="on" title="Shaded surface">Shaded</button>
    <button data-view="wire" title="Show every edge of every triangle">Wireframe</button>
    <button data-view="cost" title="Colour each edge by its QEM collapse cost">Collapse cost</button>
    <button data-view="feat" title="Sharp edges (dihedral angle over 30 degrees) and boundary edges">Features</button>
  </div>
  <div class="tr seg" id="which">
    <button data-show="original" class="on">Original</button>
    <button data-show="simplified" disabled>Simplified</button>
  </div>
  <div class="bl" id="legend"></div>
</div>

<div id="side">
  <h2>Mesh</h2>
  <div class="pad"><table id="stats"><tr><td class="muted">No mesh loaded</td></tr></table></div>

  <h2>Decimate</h2>
  <div class="pad">
    <div class="field">
      <label for="method">Method</label>
      <select id="method">
        <option value="qem">QEM</option>
        <option disabled>QEM + learned cost (not implemented)</option>
      </select>
    </div>
    <div class="field">
      <label for="keep">Keep faces</label>
      <input id="keep" type="range" min="1" max="95" value="25">
      <input id="keepNum" type="number" min="1" max="95" value="25" aria-label="Percent of faces to keep">
    </div>
    <div class="field" style="margin-bottom:0">
      <span class="muted num" id="target" style="grid-column:1 / 3; white-space:nowrap"></span>
      <button id="run" class="primary" disabled>Apply</button>
    </div>
  </div>

  <h2>Error vs. original</h2>
  <div class="pad"><table id="quality"><tr><td class="muted">Not simplified yet</td></tr></table></div>

  <h2>Edges by collapse cost</h2>
  <div class="pad">
    <div class="seg" id="edgeTabs" style="margin-bottom:6px">
      <button data-edges="cheapest_edges" class="on">Lowest</button>
      <button data-edges="costliest_edges">Highest</button>
    </div>
    <table id="edges"><tr><td class="muted">No mesh loaded</td></tr></table>
  </div>
</div>

<div id="status">Ready</div>

<script type="importmap">{ "imports": { "three": "/static/vendor/three.module.js" } }</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
